<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <title>AlecoAir</title>
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" aria-label="AlecoAir dehumidifiers">
    <div id="banner" class="msg page-msg" role="status" aria-live="polite" aria-hidden="true"></div>

    <section class="panel empty" id="emptyCard" hidden>
      <div class="glass-sheen" aria-hidden="true"></div>
      <div class="panel-body">
        <p class="empty-title">No dehumidifier configured</p>
        <p class="empty-text">Add one in Signal K Admin → Server → Plugin Config → AlecoAir.</p>
        <a class="empty-link" href="/admin/#/serverConfiguration/plugins/signalk-alecoair">Open Plugin Config</a>
      </div>
    </section>

    <div id="deviceList" class="units"></div>
  </main>

  <!-- Thin monochrome line icons. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7.05 6.6a7 7 0 1 0 9.9 0"/></symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 3.5s6.5 6.8 6.5 11.4A6.5 6.5 0 1 1 5.5 14.9C5.5 10.3 12 3.5 12 3.5z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><path d="M12 3.5s6.5 6.8 6.5 11.4A6.5 6.5 0 1 1 5.5 14.9C5.5 10.3 12 3.5 12 3.5z"/><path d="M9.6 16.2l2.4-6.2 2.4 6.2"/><path d="M10.4 14.2h3.2"/></symbol>
    <symbol id="i-co" viewBox="0 0 24 24"><path d="M13.6 12c.9-2.15 2.25-3.35 4-3.35A3.55 3.55 0 1 1 17.6 15.35c-1.75 0-3.1-1.2-4-3.35z"/><path d="M10.4 12c-.9 2.15-2.25 3.35-4 3.35A3.55 3.55 0 1 1 6.4 8.65c1.75 0 3.1 1.2 4 3.35z"/></symbol>
    <symbol id="i-sleep" viewBox="0 0 24 24"><path d="M15 5.2A7.2 7.2 0 1 0 19.6 16 6.4 6.4 0 0 1 15 5.2z"/></symbol>
    <symbol id="i-laundry" viewBox="0 0 24 24"><path d="M8.8 6.2L12 8.4l3.2-2.2 3.8 2.4-1.7 2.3V19.5H6.7V8.7L5 6.4z"/><path d="M8.8 6.2c.85 2.1 5.55 2.1 6.4 0"/></symbol>
    <symbol id="i-purify" viewBox="0 0 24 24"><path d="M6 18.5C6.2 10.5 10.5 5 19 5.5 18.7 13.5 14.5 19 6 18.5z"/><path d="M6.4 18.2C9.5 13.5 13 10.5 18.2 6.8"/></symbol>
    <symbol id="i-eco" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.55 1.55M16.45 16.45L18 18M6 18l1.55-1.55M16.45 7.55L18 6"/></symbol>
    <symbol id="i-mode" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M9.6 4.8s5.2 5.5 5.2 9.2A5.2 5.2 0 1 1 4.4 14C4.4 10.3 9.6 4.8 9.6 4.8z"/><path d="M16.2 7.2a3.6 3.6 0 0 1 2.6 2.5"/><path d="M16.7 4.6a6 6 0 0 1 4.4 4.3"/></symbol>
    <symbol id="i-compressor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.8 12c1.15-2.7 2.4-2.7 3.45 0s2.3 2.7 3.45 0 2.3-2.7 3.45 0"/></symbol>
    <symbol id="i-defrost" viewBox="0 0 24 24"><path d="M12 3.5v17"/><path d="M12 3.5l2.4 2.4M12 3.5L9.6 5.9"/><path d="M12 20.5l2.4-2.4M12 20.5l-2.4-2.4"/><path d="M4.8 8.2l14.4 7.6"/><path d="M4.8 8.2l2.8.2M4.8 8.2l.9 2.6"/><path d="M19.2 15.8l-2.8-.2M19.2 15.8l-.9-2.6"/><path d="M19.2 8.2L4.8 15.8"/><path d="M19.2 8.2l-2.8.2M19.2 8.2l-.9 2.6"/><path d="M4.8 15.8l2.8-.2M4.8 15.8l.9-2.6"/></symbol>
    <symbol id="i-tank" viewBox="0 0 24 24"><path d="M7 7.5h10v9.2a3.3 3.3 0 0 1-3.3 3.3h-3.4A3.3 3.3 0 0 1 7 16.7V7.5z"/><path d="M6.2 7.5h11.6"/><path class="tank-water" style="fill: var(--tank-fill, none); stroke: none" d="M8.3 13.2h7.4V16.4A2 2 0 0 1 13.8 18.3h-3.6a2 2 0 0 1-1.9-1.9v-3.2z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="6.5" y="10.5" width="11" height="9" rx="1.6"/><path d="M8.7 10.5V8.2a3.3 3.3 0 0 1 6.6 0v2.3"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.2"/><path d="M12 13V8.8M12 13l3.1 2"/><path d="M10 4.3h4"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-fan-low" viewBox="0 0 24 24"><rect x="6.5" y="12" width="3.2" height="7" rx="1.2"/><rect x="12.2" y="8" width="3.2" height="11" rx="1.2"/></symbol>
    <symbol id="i-fan-high" viewBox="0 0 24 24"><rect x="4.2" y="13.5" width="3.1" height="5.5" rx="1.2"/><rect x="9.55" y="10" width="3.1" height="9" rx="1.2"/><rect x="14.9" y="6.5" width="3.1" height="12.5" rx="1.2"/></symbol>
  </svg>

  <!-- One glass panel per configured unit, stacked. Built once, then only updated. -->
  <template id="deviceTemplate">
    <article class="panel">
      <div class="glass-sheen" aria-hidden="true"></div>
      <div class="panel-body">
        <header class="panel-top">
          <h2 class="name" data-r="name">—</h2>
          <div class="top-actions">
            <span class="lan" data-r="lan" role="img" aria-label="LAN offline"><i></i></span>
            <button type="button" class="icon-btn power" data-r="power" aria-label="Power" aria-pressed="false"><svg aria-hidden="true"><use href="#i-power"></use></svg></button>
          </div>
        </header>

        <div class="panel-main">
          <div class="dial">
            <div class="ring" data-r="track" role="slider" tabindex="0" aria-label="Target humidity" aria-valuemin="30" aria-valuemax="80" aria-valuenow="50">
              <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false">
                <circle class="arc-bg" data-r="arcBg" cx="100" cy="100" r="86" transform="rotate(135 100 100)"/>
                <circle class="arc-fill" data-r="arcFill" cx="100" cy="100" r="86" transform="rotate(135 100 100)"/>
                <circle class="knob" data-r="knob" cx="100" cy="14" r="7.5"/>
              </svg>
              <div class="readout">
                <div class="target" data-r="targetBox"><span class="num" data-r="target">—</span><span class="unit" data-r="targetUnit">%</span></div>
                <div class="current" data-r="current"><svg aria-hidden="true"><use data-r="currentIcon" href="#i-droplet"></use></svg><span data-r="currentValue">—</span></div>
              </div>
              <span class="end end-min" data-r="rangeMin" aria-hidden="true">30</span>
              <span class="end end-max" data-r="rangeMax" aria-hidden="true">80</span>
            </div>
          </div>

          <div class="steppers" role="group" aria-label="Target humidity">
            <button type="button" class="step step-minus" data-r="minus" aria-label="Lower target humidity"><svg aria-hidden="true"><use href="#i-minus"></use></svg></button>
            <button type="button" class="step step-plus" data-r="plus" aria-label="Raise target humidity"><svg aria-hidden="true"><use href="#i-plus"></use></svg></button>
          </div>

          <div class="side">
            <div class="modes" data-r="modes" role="radiogroup" aria-label="Working mode"></div>
            <div class="fan" data-r="fan" role="radiogroup" aria-label="Fan speed" hidden>
              <button type="button" class="fan-btn" data-fan="low" role="radio" aria-checked="false" aria-label="Fan low"><svg aria-hidden="true"><use href="#i-fan-low"></use></svg><span class="lbl">Low</span></button>
              <button type="button" class="fan-btn" data-fan="high" role="radio" aria-checked="false" aria-label="Fan high"><svg aria-hidden="true"><use href="#i-fan-high"></use></svg><span class="lbl">High</span></button>
            </div>
            <div class="msg" data-r="msg" role="status" aria-live="polite" aria-hidden="true"></div>
          </div>
        </div>
        <div class="status" data-r="status" role="group" aria-label="Status">
          <span class="stat" data-r="compressor" role="img" aria-label="Compressor" title="Compressor">Compressor</span>
          <span class="stat" data-r="defrost" role="img" aria-label="Defrost" title="Defrost">Defrost</span>
          <span class="stat danger" data-r="tank" role="img" aria-label="Tank" title="Tank">Tank full</span>
          <button type="button" class="stat" data-r="lock" aria-label="Child lock" aria-pressed="false" title="Child lock">Child lock</button>
          <div class="timer-wrap" data-r="timerWrap">
            <button type="button" class="stat" data-r="timer" aria-label="Timer" aria-haspopup="true" aria-expanded="false" title="Timer">Timer<span class="meta" data-r="timerMeta"></span></button>
            <div class="timer-pop" data-r="timerPop" role="group" aria-label="Timer off after" hidden>
              <button type="button" class="pop-btn" data-r="timerMinus" aria-label="Shorter timer">−</button>
              <span class="pop-val" data-r="timerValue" aria-live="polite">Off</span>
              <button type="button" class="pop-btn" data-r="timerPlus" aria-label="Longer timer">+</button>
            </div>
          </div>
          <button type="button" class="stat" data-r="sleepToggle" aria-label="Sleep" aria-pressed="false" title="Sleep" hidden>Sleep</button>
          <button type="button" class="stat" data-r="dryToggle" aria-label="Inside dry" aria-pressed="false" title="Inside dry: dries the unit inside after use" hidden>Inside dry</button>
          <span class="stat" data-r="extStat" role="img" aria-label="External sensor" title="External sensor">External sensor</span>
        </div>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
